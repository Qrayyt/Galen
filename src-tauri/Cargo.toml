[package]
name = "galen"
version = "0.4.1"
description = "Private local AI desktop for Windows and Arch Linux"
authors = ["Galenite"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "galen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bytes = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
html-escape = "0.2"
kothok-edge-tts = "0.2.8"
open = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time", "sync", "process"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
