name: Galen installer visual preview
on:
  push:
    branches: [feat/galen-installer-preview]
    paths:
      - 'packaging/windows/preview/**'
      - '!packaging/windows/preview/out/**'
      - '.github/workflows/galen-installer-visual-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Inno Setup 6.6+
        shell: powershell
        run: |
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler installation failed" }
      - name: Compile only the visual installer
        shell: powershell
        run: |
          & .\packaging\windows\preview\build.ps1
      - name: Store preview EXE on the isolated preview branch
        if: github.ref == 'refs/heads/feat/galen-installer-preview'
        shell: powershell
        run: |
          $exe = 'packaging/windows/preview/out/Galen-Installer-Visual-Preview.exe'
          if (-not (Test-Path $exe)) { throw 'Preview EXE missing' }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- $exe
          if ($LASTEXITCODE -ne 0) { throw 'git add failed' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'git diff failed' }
          git commit -m "Store standalone installer visual preview EXE [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git push origin HEAD:refs/heads/feat/galen-installer-preview
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
