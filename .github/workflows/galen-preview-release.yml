name: Galen 1.0 Windows preview

on:
  push:
    branches:
      - feat/galen-1.0-dodaios
    paths:
      - .galen-release-candidate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galen-windows-preview
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate sources and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      runtime_changed: ${{ steps.changes.outputs.runtime_changed }}
      frontend_changed: ${{ steps.changes.outputs.frontend_changed }}
      base: ${{ steps.changes.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan only the work invalidated since the published preview
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          tag='v1.0.0-preview.3'
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            base="$tag"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          frontend_changed=true
          if git diff --quiet "$base" "$GITHUB_SHA" -- dodaios/ui/web/frontend; then
            frontend_changed=false
          fi

          runtime_changed=true
          if git diff --quiet "$base" "$GITHUB_SHA" -- \
            dodaios packaging assets integrations/openrealtime/source \
            third_party install/update-contract.json dodaios.spec \
            dodaios.toml.example pyproject.toml LICENSE NOTICE \
            scripts/galen/brand.py; then
            runtime_changed=false
          fi

          echo "frontend_changed=$frontend_changed" >> "$GITHUB_OUTPUT"
          echo "runtime_changed=$runtime_changed" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "frontend_tree=$(git rev-parse HEAD:dodaios/ui/web/frontend)" >> "$GITHUB_OUTPUT"
          echo "base=$base frontend_changed=$frontend_changed runtime_changed=$runtime_changed" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore test evidence for identical frontend inputs
        if: steps.changes.outputs.runtime_changed == 'true' && steps.changes.outputs.frontend_changed == 'true'
        id: frontend-tests-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/frontend-tests-verified
          key: galen-frontend-tests-v2-${{ runner.os }}-${{ steps.changes.outputs.frontend_tree }}
      - name: Reuse committed evidence for the exact frontend tree
        if: steps.changes.outputs.runtime_changed == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.frontend-tests-cache.outputs.cache-hit != 'true'
        id: committed-frontend-tests
        shell: bash
        run: |
          current="$(git rev-parse HEAD:dodaios/ui/web/frontend)"
          tested="$(tr -d '\r\n' < .galen-frontend-tested)"
          if [[ "$current" == "$tested" ]]; then
            mkdir -p .ci-cache
            printf '%s\n' "$current" > .ci-cache/frontend-tests-verified
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.runtime_changed == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.frontend-tests-cache.outputs.cache-hit != 'true' && steps.committed-frontend-tests.outputs.reused != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dodaios/ui/web/frontend/package-lock.json
      - name: Validate Python and source provenance
        run: |
          python -m py_compile dodaios/__init__.py dodaios/core/branding.py \
            dodaios/core/update_contract.py dodaios/ui/web/update_routes.py dodaios/ui/relauncher.py dodaios/ui/tray.py dodaios/ui/background_tray.py dodaios/ui/native_labels.py dodaios/notify/reminders.py \
            packaging/pyinstaller_rthook_frozen.py scripts/galen/validate_release.py \
            dodaios/plugins/tool/galen_kaizumi.py \
            dodaios/plugins/tool/galen_audio_focus.py \
            dodaios/galen_sources/kaizumi/computer_control.py \
            dodaios/galen_sources/elissa/audio_mixer.py
          python - <<'PY'
          import ast, pathlib, tomllib
          tree=ast.parse(pathlib.Path('dodaios/core/branding.py').read_text())
          constants={n.targets[0].id:n.value.value for n in tree.body if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name) and isinstance(n.value,ast.Constant)}
          assert constants['PRODUCT_NAME']=='Galen'
          assert constants['WINDOWS_USER_DATA_DIR_NAME']=='GalenData'
          assert constants['DEFAULT_OFFICIAL_REPO_SLUG']=='Qrayyt/Galen'
          assert tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']=='1.0.0-preview.4'
          assert pathlib.Path('integrations/openrealtime/source/go.mod').is_file()
          assert pathlib.Path('third_party/galen-opendex/LICENSE').is_file()
          assert pathlib.Path('third_party/galen-kaizumi/LICENSE').is_file()
          assert pathlib.Path('third_party/galen-elissa/LICENSE').is_file()
          assert pathlib.Path('third_party/galen-openrealtime/LICENSE').is_file()
          PY
          python -c "from dodaios.core.update_contract import DEFAULT_CONTRACT; assert DEFAULT_CONTRACT.config_file == 'dodaios.toml'; assert DEFAULT_CONTRACT.config_files == ('dodaios.toml', 'jarvis.toml', 'galen.toml')"
          python scripts/galen/make_brand_assets.py --check
          python scripts/galen/check_russian_locales.py
          python scripts/galen/validate_release.py
          python - <<'PY'
          from dodaios.ui.native_labels import desktop_label, state_label
          assert desktop_label('Open', 'Открыть', lang='ru') == 'Открыть'
          assert state_label('listening', lang='ru') == 'Слушаю'
          PY
      - name: Test changed React sources
        if: steps.changes.outputs.runtime_changed == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.frontend-tests-cache.outputs.cache-hit != 'true' && steps.committed-frontend-tests.outputs.reused != 'true'
        working-directory: dodaios/ui/web/frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          TEST_BASE: ${{ steps.changes.outputs.base }}
        run: |
          npm ci
          npm test -- --changed "$TEST_BASE"
          mkdir -p ../../../../.ci-cache
          printf '%s\n' "$GITHUB_SHA" > ../../../../.ci-cache/frontend-tests-verified
      - name: Save successful frontend test evidence immediately
        if: steps.changes.outputs.runtime_changed == 'true' && steps.changes.outputs.frontend_changed == 'true' && steps.frontend-tests-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/frontend-tests-verified
          key: ${{ steps.frontend-tests-cache.outputs.cache-primary-key }}
  windows:
    name: Build and publish Windows desktop installer
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Restore an identical verified Windows installer
        id: installer-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            dist/installers/Galen-Setup-x64.exe
            dist/installers/Galen-Setup-x64.exe.sha256
          key: galen-installer-v2-${{ runner.os }}-${{ hashFiles('dodaios/**', 'packaging/**', 'assets/**', 'integrations/openrealtime/source/**', 'third_party/**', 'install/update-contract.json', 'dodaios.spec', 'dodaios.toml.example', 'pyproject.toml', 'LICENSE', 'NOTICE', 'scripts/galen/brand.py', 'scripts/pip_install.py', 'requirements.in', 'requirements.txt', 'uv.lock') }}
      - name: Reuse the published installer when runtime inputs did not change
        if: steps.installer-cache.outputs.cache-hit != 'true' && needs.preflight.outputs.runtime_changed == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force dist/installers | Out-Null
          gh release download v1.0.0-preview.3 --repo $env:GITHUB_REPOSITORY `
            --pattern "Galen-Setup-x64.exe*" --dir dist/installers --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        if: steps.installer-cache.outputs.cache-hit != 'true' && needs.preflight.outputs.runtime_changed == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dodaios/ui/web/frontend/package-lock.json
      - name: Identify exact frontend inputs
        if: steps.installer-cache.outputs.cache-hit != 'true' && needs.preflight.outputs.runtime_changed == 'true'
        id: frontend-input
        shell: bash
        run: echo "tree=$(git rev-parse HEAD:dodaios/ui/web/frontend)" >> "$GITHUB_OUTPUT"
      - name: Restore previously built Windows frontend
        if: steps.installer-cache.outputs.cache-hit != 'true' && needs.preflight.outputs.runtime_changed == 'true'
        id: windows-frontend
        uses: actions/cache@v4
        with:
          path: dodaios/ui/web/dist
          key: galen-frontend-v2-${{ runner.os }}-${{ steps.frontend-input.outputs.tree }}
      - name: Build frontend on the packaging runner
        if: steps.installer-cache.outputs.cache-hit != 'true' && needs.preflight.outputs.runtime_changed == 'true'
        working-directory: dodaios/ui/web/frontend
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          if [[ "${{ steps.windows-frontend.outputs.cache-hit }}" != "true" || ! -s ../dist/index.html ]]; then
            npm ci
            npm run build
          fi
          test -s ../dist/index.html
      - uses: actions/setup-python@v5
        if: steps.installer-cache.outputs.cache-hit != 'true' && needs.preflight.outputs.runtime_changed == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Restore the unchanged OpenRealtime companion
        if: steps.installer-cache.outputs.cache-hit != 'true' && needs.preflight.outputs.runtime_changed == 'true'
        id: realtime-cache
        uses: actions/cache@v4
        with:
          path: integrations/openrealtime/bin/openrealtime.exe
          key: galen-openrealtime-v1-${{ runner.os }}-${{ hashFiles('integrations/openrealtime/source/**') }}
      - uses: actions/setup-go@v5
        if: steps.installer-cache.outputs.cache-hit != 'true' && needs.preflight.outputs.runtime_changed == 'true' && steps.realtime-cache.outputs.cache-hit != 'true'
        with:
          go-version: '1.25'
          cache-dependency-path: integrations/openrealtime/source/go.sum
      - name: Install Python desktop dependencies
        if: steps.installer-cache.outputs.cache-hit != 'true' && needs.preflight.outputs.runtime_changed == 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python scripts/pip_install.py -e ".[desktop,dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile the optional OpenRealtime runtime
        if: steps.installer-cache.outputs.cache-hit != 'true' && needs.preflight.outputs.runtime_changed == 'true' && steps.realtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force integrations/openrealtime/bin | Out-Null
          Push-Location integrations/openrealtime/source
          go build -o ../bin/openrealtime.exe ./cmd/openrealtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Ensure Inno Setup 6 is available
        if: steps.installer-cache.outputs.cache-hit != 'true' && needs.preflight.outputs.runtime_changed == 'true'
        shell: pwsh
        run: |
          $candidate = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $candidate)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build Galen desktop application
        if: steps.installer-cache.outputs.cache-hit != 'true' && needs.preflight.outputs.runtime_changed == 'true'
        shell: pwsh
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          pwsh packaging/windows/build.ps1 -SkipFrontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/installers/Galen-Setup-x64.exe")) { throw "Missing installer" }
          if (-not (Test-Path "dist/Jarvis/GalenApp.exe")) { throw "Missing Galen desktop executable" }
          if (-not (Test-Path "dist/Jarvis/GalenRealtime.exe")) { throw "Missing realtime companion" }
          $hash = (Get-FileHash -Algorithm SHA256 "dist/installers/Galen-Setup-x64.exe").Hash.ToLowerInvariant()
          "$hash  Galen-Setup-x64.exe" | Set-Content -Encoding ascii "dist/installers/Galen-Setup-x64.exe.sha256"
          "$hash  Galen-Setup-x64.exe" | Set-Content -Encoding ascii "dist/installers/installers-SHA256SUMS.txt"
      - name: Verify the reused or rebuilt installer
        shell: pwsh
        run: |
          $installer = "dist/installers/Galen-Setup-x64.exe"
          $checksum = "$installer.sha256"
          $manifest = "dist/installers/installers-SHA256SUMS.txt"
          if (-not (Test-Path $manifest) -and (Test-Path $checksum)) {
            Copy-Item -LiteralPath $checksum -Destination $manifest
          }
          if (-not (Test-Path $installer) -or -not (Test-Path $checksum) -or -not (Test-Path $manifest)) { throw "Missing installer or checksum" }
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $expected = ((Get-Content $checksum -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $expected) { throw "Installer checksum mismatch" }
          $manifestExpected = ((Get-Content $manifest -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $manifestExpected) { throw "Update manifest checksum mismatch" }
      - name: Save the verified installer for identical runtime inputs
        if: steps.installer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dist/installers/Galen-Setup-x64.exe
            dist/installers/Galen-Setup-x64.exe.sha256
            dist/installers/installers-SHA256SUMS.txt
          key: ${{ steps.installer-cache.outputs.cache-primary-key }}
      - name: Publish release only after successful build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag='v1.0.0-preview.4'
          test -s dist/installers/Galen-Setup-x64.exe
          test -s dist/installers/Galen-Setup-x64.exe.sha256
          test -s dist/installers/installers-SHA256SUMS.txt
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            # A rebuilt preview must keep its source tag, notes and installer on
            # the same commit. Merely clobbering the assets leaves GitHub's
            # source archives pointing at the previous candidate.
            gh api --method PATCH "repos/$REPO/git/refs/tags/$tag" \
              -f sha="$TARGET_SHA" -F force=true >/dev/null
            gh release upload "$tag" dist/installers/Galen-Setup-x64.exe dist/installers/Galen-Setup-x64.exe.sha256 dist/installers/installers-SHA256SUMS.txt --clobber --repo "$REPO"
            gh release edit "$tag" --repo "$REPO" --target "$TARGET_SHA" --prerelease \
              --title "Galen 1.0 Preview 4 · Galenite" \
              --notes-file docs/GALEN_1_0_PREVIEW_4.md
          else
            gh release create "$tag" dist/installers/Galen-Setup-x64.exe dist/installers/Galen-Setup-x64.exe.sha256 dist/installers/installers-SHA256SUMS.txt \
              --repo "$REPO" --target "$TARGET_SHA" --prerelease \
              --title "Galen 1.0 Preview 4 · Galenite" \
              --notes-file docs/GALEN_1_0_PREVIEW_4.md
          fi
          gh release view "$tag" --repo "$REPO" --json url,assets | tee release-result.json
