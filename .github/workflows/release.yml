name: Release Galen

# Windows uploads first, then Linux, so release assets cannot race each other.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galen-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Test native agent runtime
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Generate native icons
        run: npm run tauri icon src-tauri/icons/icon.png

      - name: Build and upload Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Galen ${{ needs.prepare.outputs.tag }}"
          releaseBody: |
            Galen 0.8 turns the local assistant into a visible action workspace.

            - direct local image and video generation in the new Galen Studio
            - discover and launch installed Windows/Linux applications with approval gates
            - PowerShell, CMD, and sh console with exit code, stdout, stderr, and duration
            - visible action receipts for agent tools instead of black-box execution
            - intent-routed tools and compact Core Prompt v3 for faster small local models
            - polished monochrome Studio interface with readiness diagnostics
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

  linux:
    needs: [prepare, windows]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Test native agent runtime
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Generate native icons
        run: npm run tauri icon src-tauri/icons/icon.png

      - name: Build and upload Linux AppImage
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Galen ${{ needs.prepare.outputs.tag }}"
          releaseBody: |
            Galen 0.8 turns the local assistant into a visible action workspace.

            - direct local image and video generation in the new Galen Studio
            - discover and launch installed Windows/Linux applications with approval gates
            - PowerShell, CMD, and sh console with exit code, stdout, stderr, and duration
            - visible action receipts for agent tools instead of black-box execution
            - intent-routed tools and compact Core Prompt v3 for faster small local models
            - polished monochrome Studio interface with readiness diagnostics
          releaseDraft: true
          prerelease: false
          args: --bundles appimage

  publish:
    needs: [prepare, windows, linux]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify both platform assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="$(gh release view "${{ needs.prepare.outputs.tag }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
          echo "$assets"
          grep -q -- '-setup.exe$' <<< "$assets"
          grep -q -- '.AppImage$' <<< "$assets"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --repo "${{ github.repository }}" --draft=false
