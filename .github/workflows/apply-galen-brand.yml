name: Apply Galenite identity

on:
  push:
    branches:
      - feat/galen-1.0-dodaios
    paths:
      - scripts/galen/brand.py
      - .github/workflows/apply-galen-brand.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply product naming and preserve standalone identity
        run: python scripts/galen/brand.py
      - name: Validate brand identifiers and source attribution
        run: |
          python -m py_compile dodaios/core/branding.py dodaios/__init__.py \
            scripts/galen/brand.py scripts/galen/validate_release.py
          python scripts/galen/validate_release.py
          python - <<'PY'
          import ast
          from pathlib import Path
          p = ast.parse(Path("dodaios/core/branding.py").read_text(encoding="utf-8"))
          names = {n.targets[0].id:ast.literal_eval(n.value) for n in p.body if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name) and n.targets[0].id in {'PRODUCT_NAME','WINDOWS_USER_DATA_DIR_NAME','DEFAULT_OFFICIAL_REPO_SLUG','WINDOWS_MUTEX_NAME'}}
          assert names["PRODUCT_NAME"] == "Galen"
          assert names["WINDOWS_USER_DATA_DIR_NAME"] == "Galen"
          assert names["DEFAULT_OFFICIAL_REPO_SLUG"] == "Qrayyt/Galen"
          assert names["WINDOWS_MUTEX_NAME"] == r"Global\Galen_v1"
          assert Path("NOTICE").exists() and Path("LICENSE").exists()
          assert Path("assets/galen-brand/icon.ico").exists()
          PY
      - name: Commit the rewritten application files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dodaios.spec dodaios/__init__.py pyproject.toml dodaios/core/branding.py \
            dodaios/ui/web/frontend/src/lib/branding.ts \
            dodaios/ui/web/frontend/src/i18n/locales \
            dodaios/ui/web/frontend/public/dodaios-logo.png \
            dodaios/ui/web/frontend/public/dodaios-mark-256.png \
            dodaios/ui/web/frontend/public/dodaios-gigi-256.png \
            dodaios/ui/web/frontend/public/dodaios.ico \
            dodaios/ui/web/frontend/public/dodaios-gigi.ico \
            dodaios/assets/icons/dodaios.png dodaios/assets/icons/dodaios.ico \
            assets/icons/dodaios.ico packaging/pyinstaller_rthook_frozen.py \
            packaging/windows/build.ps1 packaging/windows/Dodaios.iss \
            scripts/galen/validate_release.py
          if git diff --cached --quiet; then
            echo 'Brand overlay unchanged'
          else
            git commit -m 'feat(brand): Galen desktop identity and isolated user profile'
            git push origin HEAD:feat/galen-1.0-dodaios
          fi
