name: Publish verified Galen Preview 6
on:
  push:
    branches: [feat/galen-next-release]
    paths: ['.galen-publish-preview6']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: galen-publish-preview6
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: da7a30e43dd87fbb429ca2df5854bb66ebbd7012
      BUILD_RUN: '45675994014'
      CHECK_RUN: '45675994013'
      TAG: v1.0.0-preview.6
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact successful candidate and focused run
        run: |
          set -euo pipefail
          for id in "$BUILD_RUN" "$CHECK_RUN"; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" | jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .head_branch == "feat/galen-next-release" and .status == "completed" and .conclusion == "success"'
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs?per_page=100" | jq -e '.total_count == 6 and ([.jobs[].conclusion] | all(. == "success"))'
      - name: Download exact candidate artifacts
        run: |
          set -euo pipefail
          mkdir -p assets
          for platform in Windows macOS-arm64 macOS-x64; do
            gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "Galen-next-$platform-$SOURCE_SHA" --dir assets
          done
          cd assets
          for file in Galen-Setup-x64.exe Galen-macOS-arm64.dmg Galen-macOS-x64.dmg; do
            test -s "$file"
            test -s "$file.sha256"
            sha256sum -c "$file.sha256"
          done
          cmp Galen-Setup-x64.exe.sha256 installers-SHA256SUMS.txt
      - name: Verify existing draft through REST API
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/458599276" > release.json
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          r=json.load(open('release.json'))
          assert r['draft'] and r['prerelease'] and r['target_commitish']==os.environ['SOURCE_SHA'] and r['tag_name']==os.environ['TAG']
          expected = {'Galen-Setup-x64.exe','Galen-Setup-x64.exe.sha256','installers-SHA256SUMS.txt','Galen-macOS-arm64.dmg','Galen-macOS-arm64.dmg.sha256','Galen-macOS-x64.dmg','Galen-macOS-x64.dmg.sha256'}
          actual = {a['name'] for a in r['assets']}
          assert actual == expected and len(r['assets'])==len(expected), (actual, expected)
          for a in r['assets']:
              p=pathlib.Path('assets') / a['name']
              assert p.is_file() and a['state']=='uploaded' and a['size']==p.stat().st_size, a['name']
              with p.open('rb') as f:
                  digest='sha256:'+hashlib.file_digest(f,'sha256').hexdigest()
              assert a['digest']==digest, a['name']
              print(a['name'], 'verified')
          PY
      - name: Publish verified draft and verify source tag
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > tag.json 2>/dev/null; then
            jq -e --arg sha "$SOURCE_SHA" '.object.type=="commit" and .object.sha==$sha' tag.json
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/458599276" -F draft=false -F prerelease=true | jq -e --arg tag "$TAG" '.draft==false and .prerelease==true and .tag_name==$tag and (.assets|length)==7'
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" | jq -e --arg sha "$SOURCE_SHA" '.object.type=="commit" and .object.sha==$sha'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease
