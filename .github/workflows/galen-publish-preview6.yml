name: Publish verified Galen Preview 6
on:
  push:
    branches: [feat/galen-next-release]
    paths: ['.galen-publish-preview6']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: galen-publish-preview6
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: da7a30e43dd87fbb429ca2df5854bb66ebbd7012
      BUILD_RUN: '45675994014'
      CHECK_RUN: '45675994013'
      TAG: v1.0.0-preview.6
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact successful candidate and focused run
        run: |
          set -euo pipefail
          for id in "$BUILD_RUN" "$CHECK_RUN"; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" | jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .head_branch == "feat/galen-next-release" and .status == "completed" and .conclusion == "success"'
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs?per_page=100" | jq -e '.total_count == 6 and ([.jobs[].conclusion] | all(. == "success"))'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release"; exit 1
          fi
      - name: Download exact candidate artifacts
        run: |
          set -euo pipefail
          mkdir -p assets
          for platform in Windows macOS-arm64 macOS-x64; do
            gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "Galen-next-$platform-$SOURCE_SHA" --dir assets
          done
          cd assets
          for file in Galen-Setup-x64.exe Galen-macOS-arm64.dmg Galen-macOS-x64.dmg; do
            test -s "$file"
            test -s "$file.sha256"
            sha256sum -c "$file.sha256"
          done
          cmp Galen-Setup-x64.exe.sha256 installers-SHA256SUMS.txt
      - name: Create draft and upload all verified assets
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --draft --prerelease --title "Galen 1.0 Preview 6 · Galenite" --notes-file docs/GALEN_1_0_PREVIEW_6.md
          gh release upload "$TAG" assets/Galen-Setup-x64.exe assets/Galen-Setup-x64.exe.sha256 assets/installers-SHA256SUMS.txt assets/Galen-macOS-arm64.dmg assets/Galen-macOS-arm64.dmg.sha256 assets/Galen-macOS-x64.dmg assets/Galen-macOS-x64.dmg.sha256 --repo "$GITHUB_REPOSITORY"
      - name: Verify uploaded assets and publish
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft,isPrerelease,targetCommitish > release.json
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          r=json.load(open('release.json'))
          assert r['isDraft'] and r['isPrerelease'] and r['targetCommitish']==os.environ['SOURCE_SHA'], r.keys()
          files={p.name:p for p in pathlib.Path('assets').iterdir() if p.is_file()}
          assert len(r['assets'])==7 and len(files)==7
          for a in r['assets']:
              p=files[a['name']]
              assert a['state']=='uploaded' and a['size']==p.stat().st_size, a['name']
              with p.open('rb') as f:
                  digest='sha256:'+hashlib.file_digest(f,'sha256').hexdigest()
              assert a['digest']==digest, a['name']
          PY
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets
