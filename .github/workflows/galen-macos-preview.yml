name: Galen macOS Preview 5
on:
  push:
    branches: [v1.0.0]
    paths: ['.galen-macos-release-candidate']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: galen-macos-preview
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            machine: arm64
          - runner: macos-15-intel
            arch: x64
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check host and version
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          grep -F '__version__ = "1.0.0-preview.5"' dodaios/__init__.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dodaios/ui/web/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install macOS build dependencies
        run: |
          python -m pip install --upgrade pip
          python scripts/pip_install.py -e ".[desktop,desktop-macos,dev]"
          python -m pip install 'dmgbuild==1.6.7' Pillow
      - name: Build and verify branded DMG
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          bash packaging/macos/build.sh
          python scripts/ci/check_frozen_macos_app.py --app dist/Galen.app
          test "$(dist/Galen.app/Contents/MacOS/galen --version | grep -o '1.0.0-preview.5' | head -1)" = "1.0.0-preview.5"
          cd dist/installers
          file="Galen-macOS-${{ matrix.arch }}.dmg"
          test -s "$file"
          shasum -a 256 "$file" > "$file.sha256"
      - name: Store verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galen-macOS-${{ matrix.arch }}
          path: |
            dist/installers/Galen-macOS-${{ matrix.arch }}.dmg
            dist/installers/Galen-macOS-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
      - name: Publish only notarized macOS installer to existing Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist/installers
          file="Galen-macOS-${{ matrix.arch }}.dmg"
          if ! xcrun stapler validate "$file"; then
            echo "::warning::No Apple notarization ticket. Build is available as a CI artifact only; public download is not enabled."
            echo 'Public publication blocked: Apple Developer ID / notarization required.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          shasum -a 256 -c "$file.sha256"
          gh release view v1.0.0-preview.5 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload v1.0.0-preview.5 "$file" "$file.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Published $file to Preview 5." >> "$GITHUB_STEP_SUMMARY"
