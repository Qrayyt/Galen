name: Galen macOS Preview 5
on:
  push:
    branches: [v1.0.0]
    paths: ['.galen-macos-release-candidate']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: galen-macos-preview
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            machine: arm64
          - runner: macos-15-intel
            arch: x64
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check host and version
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          grep -F '__version__ = "1.0.0-preview.5"' dodaios/__init__.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dodaios/ui/web/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install macOS build dependencies
        run: |
          python -m pip install --upgrade pip
          python scripts/pip_install.py -e ".[desktop,desktop-macos,dev]"
          python -m pip install 'dmgbuild==1.6.7' Pillow
      - name: Build and verify branded DMG
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          bash packaging/macos/build.sh
          python scripts/ci/check_frozen_macos_app.py --app dist/Galen.app
          test "$(dist/Galen.app/Contents/MacOS/galen --version | grep -o '1.0.0-preview.5' | head -1)" = "1.0.0-preview.5"
          cd dist/installers
          file="Galen-macOS-${{ matrix.arch }}.dmg"
          test -s "$file"
          shasum -a 256 "$file" > "$file.sha256"
      - name: Store verified DMG in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist/installers
          file="Galen-macOS-${{ matrix.arch }}.dmg"
          shasum -a 256 -c "$file.sha256"
          if xcrun stapler validate "$file"; then
            gh release view v1.0.0-preview.5 --repo "$GITHUB_REPOSITORY" >/dev/null
            gh release upload v1.0.0-preview.5 "$file" "$file.sha256" --repo "$GITHUB_REPOSITORY" --clobber
            echo "Published $file to Preview 5." >> "$GITHUB_STEP_SUMMARY"
          else
            tag="macos-preview-5-${{ matrix.arch }}-test-${{ github.run_id }}-${{ github.run_attempt }}"
            gh release create "$tag" "$file" "$file.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "Galen Preview 5 macOS ${{ matrix.arch }} — local testing only" --notes "Ad-hoc signed, not Apple-notarized. Verified build and checksum; not a public distribution release."
            echo "::warning::Apple notarization missing. Verified DMG saved to a private draft release for local testing."
            echo "Local test DMG: https://github.com/$GITHUB_REPOSITORY/releases (draft $tag). Public website publication remains blocked until notarization." >> "$GITHUB_STEP_SUMMARY"
          fi
