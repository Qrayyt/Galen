name: Galen 1.0 smoke checks

on:
  push:
    branches:
      - feat/galen-1.0-dodaios
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      release_candidate: ${{ steps.diff.outputs.release_candidate }}
      base: ${{ steps.diff.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect which checks this push invalidated
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          published='v1.0.0-preview.1'
          if git rev-parse --verify "refs/tags/$published" >/dev/null 2>&1; then
            base="$published"
          else
            base="${{ github.event.before }}"
            if [[ "${{ github.event_name }}" == 'workflow_dispatch' || -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse HEAD^)"
            fi
          fi

          frontend=false
          if ! git diff --quiet "$base" "$GITHUB_SHA" -- dodaios/ui/web/frontend; then
            frontend=true
          fi

          release_candidate=false
          if git diff --name-only "$base" "$GITHUB_SHA" -- .galen-release-candidate | grep -qx '.galen-release-candidate'; then
            release_candidate=true
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "release_candidate=$release_candidate" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed Python modules
        run: |
          python -m py_compile dodaios/core/config.py dodaios/core/update_contract.py \
            dodaios/core/installer_update.py dodaios/ui/relauncher.py \
            dodaios/ui/web/settings_routes.py dodaios/ui/web/update_routes.py \
            packaging/pyinstaller_rthook_frozen.py scripts/galen/brand.py \
            scripts/galen/validate_release.py scripts/galen/make_brand_assets.py \
            scripts/galen/check_russian_locales.py scripts/galen/sync_russian_locales.py
          python -c "from dodaios.core.update_contract import DEFAULT_CONTRACT; assert DEFAULT_CONTRACT.config_file == 'dodaios.toml'; assert DEFAULT_CONTRACT.config_files == ('dodaios.toml', 'jarvis.toml', 'galen.toml')"
          python scripts/galen/make_brand_assets.py --check
          python scripts/galen/validate_release.py
      - name: Validate Russian locale data
        run: python scripts/galen/check_russian_locales.py

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.release_candidate != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dodaios/ui/web/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Restore an already verified frontend with identical inputs
        id: frontend-cache
        uses: actions/cache@v4
        with:
          path: |
            dodaios/ui/web/dist
            .ci-cache/frontend-verified
          key: galen-frontend-v1-${{ runner.os }}-${{ hashFiles('dodaios/ui/web/frontend/package.json', 'dodaios/ui/web/frontend/package-lock.json', 'dodaios/ui/web/frontend/vite.config.ts', 'dodaios/ui/web/frontend/tsconfig*.json', 'dodaios/ui/web/frontend/src/**', 'dodaios/ui/web/frontend/public/**') }}
      - name: Restore test evidence for identical frontend inputs
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        id: frontend-tests-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/frontend-tests-verified
          key: galen-frontend-tests-v1-${{ runner.os }}-${{ hashFiles('dodaios/ui/web/frontend/package.json', 'dodaios/ui/web/frontend/package-lock.json', 'dodaios/ui/web/frontend/vite.config.ts', 'dodaios/ui/web/frontend/tsconfig*.json', 'dodaios/ui/web/frontend/src/**', 'dodaios/ui/web/frontend/public/**') }}
      - name: Reuse committed evidence for the exact frontend tree
        if: steps.frontend-cache.outputs.cache-hit != 'true' && steps.frontend-tests-cache.outputs.cache-hit != 'true'
        id: committed-frontend-tests
        run: |
          current="$(git rev-parse HEAD:dodaios/ui/web/frontend)"
          tested="$(tr -d '\r\n' < ../../../../.galen-frontend-tested)"
          if [[ "$current" == "$tested" ]]; then
            mkdir -p ../../../../.ci-cache
            printf '%s\n' "$current" > ../../../../.ci-cache/frontend-tests-verified
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dodaios/ui/web/frontend/package-lock.json
      - if: steps.frontend-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Test uncached frontend inputs
        if: steps.frontend-cache.outputs.cache-hit != 'true' && steps.frontend-tests-cache.outputs.cache-hit != 'true' && steps.committed-frontend-tests.outputs.reused != 'true'
        env:
          TEST_BASE: ${{ needs.changes.outputs.base }}
        run: |
          npm test -- --changed "$TEST_BASE"
          mkdir -p ../../../../.ci-cache
          printf '%s\n' "$GITHUB_SHA" > ../../../../.ci-cache/frontend-tests-verified
      - name: Save successful frontend test evidence immediately
        if: steps.frontend-cache.outputs.cache-hit != 'true' && steps.frontend-tests-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/frontend-tests-verified
          key: ${{ steps.frontend-tests-cache.outputs.cache-primary-key }}
      - if: steps.frontend-cache.outputs.cache-hit != 'true'
        run: |
          npm run build
          mkdir -p ../../../../.ci-cache
          printf '%s\n' "$GITHUB_SHA" > ../../../../.ci-cache/frontend-verified
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Verify the cached or rebuilt bundle
        run: |
          test -s ../dist/index.html
          test -s ../../../../.ci-cache/frontend-verified
