name: Apply Galen 0.5 upgrade once

on:
  push:
    branches: [feat/galen-core-v2-auto-update]
    paths:
      - "scripts/.upgrade_v050.part*"
      - ".github/workflows/upgrade-v050-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galen-v050-upgrade
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/galen-core-v2-auto-update
          fetch-depth: 0

      - name: Reconstruct and apply upgrade
        shell: bash
        run: |
          cat scripts/.upgrade_v050.part* | base64 -d | gzip -d > /tmp/upgrade_v050.py
          python -m py_compile /tmp/upgrade_v050.py
          python /tmp/upgrade_v050.py
          cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check native runtime
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test native runtime
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Commit validated Galen 0.5 implementation
        shell: bash
        run: |
          rm -f scripts/.upgrade_v050.part*
          rm -f .github/workflows/upgrade-v050-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Galen 0.5 — smarter agent and seamless auto-updates"
          git push origin HEAD:feat/galen-core-v2-auto-update
