name: Export validated Galen 0.5 source

on:
  push:
    branches: [feat/galen-core-v2-auto-update]
    paths:
      - ".github/workflows/upgrade-v050-once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galen-v050-upgrade
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/galen-core-v2-auto-update
          fetch-depth: 0

      - name: Reconstruct exact validated upgrade
        shell: bash
        run: |
          cat scripts/.upgrade_v050.part* | base64 -d | gzip -d > /tmp/upgrade_v050.py
          python -m py_compile /tmp/upgrade_v050.py
          python /tmp/upgrade_v050.py
          cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Prepare source artifact
        shell: bash
        run: |
          mkdir -p /tmp/galen-v050
          for path in \
            README.md \
            package.json \
            package-lock.json \
            src-tauri/Cargo.toml \
            src-tauri/Cargo.lock \
            src-tauri/tauri.conf.json \
            src-tauri/src/lib.rs \
            .github/workflows/release.yml \
            src/app/App.tsx \
            src/types.ts \
            src/lib/native.ts \
            src/lib/updater.ts \
            src/components/UpdateToast.tsx \
            src/components/SettingsPanel.tsx \
            src/styles.css; do
            mkdir -p "/tmp/galen-v050/$(dirname "$path")"
            cp "$path" "/tmp/galen-v050/$path"
          done

      - name: Upload validated Galen 0.5 source
        uses: actions/upload-artifact@v4
        with:
          name: galen-v050-validated-source
          path: /tmp/galen-v050
          if-no-files-found: error
          retention-days: 1
