name: Prepare final Galen 0.5 commit

on:
  push:
    branches: [feat/galen-core-v2-auto-update]
    paths:
      - ".github/workflows/upgrade-v050-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galen-v050-final-object
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/galen-core-v2-auto-update
          fetch-depth: 0

      - name: Reconstruct exact upgrade
        shell: bash
        run: |
          cat scripts/.upgrade_v050.part* | base64 -d | gzip -d > /tmp/upgrade_v050.py
          python -m py_compile /tmp/upgrade_v050.py
          python /tmp/upgrade_v050.py
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('tool loop (2 / 5 / 8 steps)', 'tool loop (4 / 8 / 14 steps)')
          marker = 'Модели Ollama не удаляются при обновлении Galen.\n'
          note = ('\n> Поскольку исходный репозиторий Galen сейчас приватный, встроенная проверка обновлений использует '
                  'авторизованный GitHub CLI (`gh`). Токены внутрь приложения не зашиваются.\n')
          if marker in text and note.strip() not in text:
              text = text.replace(marker, marker + note)
          readme.write_text(text, encoding='utf-8')

          release = Path('.github/workflows/release.yml')
          text = release.read_text(encoding='utf-8')
          text = text.replace('Galen 0.4 is a visual and intelligence upgrade for the local desktop agent.',
                              'Galen 0.5 makes the local agent substantially more autonomous and adds seamless in-app updates.')
          text = text.replace('- Galen Core Prompt v1 with editable persistent user instructions',
                              '- Galen Core Prompt v2 with execution-first planning, verification and stronger tool use')
          text = text.replace('- polished ChatGPT-like monochrome interface and Markdown rendering',
                              '- automatic update checks every 5 minutes with in-app download progress and silent restart')
          release.write_text(text, encoding='utf-8')
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          rm -f scripts/.upgrade_v050.part*
          rm -f .github/workflows/upgrade-v050-once.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check native runtime
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test native runtime
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Create remote Git commit object without updating branch ref
        id: object
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          git add -A

          python - <<'PY'
          import json, os, pathlib, subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          parent = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          raw = subprocess.check_output(['git','diff','--cached','--name-status','-z','HEAD'])
          parts = raw.split(b'\0')
          changes = []
          i = 0
          while i < len(parts) and parts[i]:
              status = parts[i].decode('utf-8', 'surrogateescape')
              i += 1
              code = status[0]
              if code in ('R','C'):
                  old = parts[i].decode('utf-8', 'surrogateescape'); i += 1
                  path = parts[i].decode('utf-8', 'surrogateescape'); i += 1
              else:
                  path = parts[i].decode('utf-8', 'surrogateescape'); i += 1
              if code == 'D':
                  changes.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode = subprocess.check_output(['git','ls-files','-s','--',path], text=True).split()[0]
              data = pathlib.Path(path).read_bytes()
              import base64
              payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              result = subprocess.check_output([
                  'gh','api','--method','POST',f'repos/{repo}/git/blobs','--input','-'
              ], input=payload, text=True)
              sha = json.loads(result)['sha']
              changes.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': sha})

          tree_payload = json.dumps({'base_tree': base_tree, 'tree': changes})
          tree_result = subprocess.check_output([
              'gh','api','--method','POST',f'repos/{repo}/git/trees','--input','-'
          ], input=tree_payload, text=True)
          tree_sha = json.loads(tree_result)['sha']

          commit_payload = json.dumps({
              'message': 'Galen 0.5 — smarter agent and seamless auto-updates',
              'tree': tree_sha,
              'parents': [parent],
          })
          commit_result = subprocess.check_output([
              'gh','api','--method','POST',f'repos/{repo}/git/commits','--input','-'
          ], input=commit_payload, text=True)
          commit_sha = json.loads(commit_result)['sha']
          pathlib.Path('/tmp/final-commit-sha.txt').write_text(commit_sha + '\n', encoding='utf-8')
          print(f'FINAL_COMMIT_SHA={commit_sha}')
          PY

      - name: Upload final commit SHA
        uses: actions/upload-artifact@v4
        with:
          name: galen-v050-final-commit
          path: /tmp/final-commit-sha.txt
          retention-days: 1
