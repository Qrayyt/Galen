# Include inside the existing galen.galenite.org HTTPS server only.
# No moderation endpoint, archive proxy, arbitrary route, or other service.
location = /glnt/v1/catalog {
    limit_req zone=glnt_catalog_read burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8768/v1/catalog;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
location ^~ /glnt/v1/catalog/ {
    limit_req zone=glnt_catalog_read burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8768/v1/catalog/;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
location = /glnt/v1/submissions {
    limit_req zone=glnt_catalog_submit burst=2 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8768/v1/submissions;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 3s;
    proxy_read_timeout 90s;
    access_log off;
}
location ^~ /glnt/ {
    return 404;
}
