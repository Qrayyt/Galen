# Include within the Galen HTTPS server; the /downloads/ fallback must not use ^~.
# Preserve legacy download URLs while serving installer bytes only from GitHub.
location ~ "^/downloads/(?:macos/)?(?<galen_tag>v[0-9]+[.][0-9]+[.][0-9]+(?:-preview[.][0-9]+)?)-[a-f0-9]{16}/(?<galen_asset>Galen-Setup-x64[.]exe|Galen-macOS-(?:arm64|x64)[.]dmg)$" {
    return 302 https://github.com/Qrayyt/Galen/releases/download/$galen_tag/$galen_asset;
}
